<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>llm-chatbot-tutorial — live demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c2430;
    --panel: #141a23;
    --border: #2a3542;
    --ink: #e7e2d3;
    --muted: #6b7686;
    --accent: #e8a33d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 24px 16px;
  }
  .terminal {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
    min-height: 560px;
    max-height: 82vh;
  }
  .terminal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .terminal-header .title {
    color: var(--ink);
  }
  .terminal-header .subtitle {
    color: var(--muted);
    margin-top: 4px;
    font-size: 12px;
  }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .line { margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
  .line .prefix { color: var(--muted); margin-right: 6px; }
  .line.user .prefix { color: var(--ink); }
  .line.assistant .prefix { color: var(--accent); }
  .line.error { color: #d97757; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--accent);
    margin-left: 2px;
    transform: translateY(2px);
    animation: blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; opacity: 0.8; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  form {
    display: flex;
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    gap: 10px;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    caret-color: var(--accent);
    padding: 8px 4px;
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="title">llm-chatbot-tutorial — live demo</div>
      <div class="subtitle">Streaming responses from Groq, in real time.</div>
    </div>
    <div class="log" id="log">
      <div class="line" style="color: var(--muted)">Waiting for your first message.</div>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="Message the model..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let firstMessage = true;

  function addLine(prefix, className) {
    if (firstMessage) {
      log.innerHTML = "";
      firstMessage = false;
    }
    const line = document.createElement("div");
    line.className = "line " + className;
    const span = document.createElement("span");
    span.className = "prefix";
    span.textContent = prefix;
    line.appendChild(span);
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    return line;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addLine("$", "user").append(message);
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    const assistantLine = addLine("#", "assistant");
    const textNode = document.createTextNode("");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    assistantLine.appendChild(textNode);
    assistantLine.appendChild(cursor);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        textNode.textContent += decoder.decode(value, { stream: true });
        log.scrollTop = log.scrollHeight;
      }
    } catch (err) {
      const errLine = addLine("!", "error");
      errLine.append("Something went wrong reaching the model. Try again.");
    } finally {
      cursor.remove();
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
